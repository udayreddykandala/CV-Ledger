# Backend + database on Render. The frontend goes to Vercel (see README).
services:
  - type: web
    name: cv-ledger-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cv-ledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://cv-ledger.vercel.app
    disk:
      name: cv-uploads
      mountPath: /data
      sizeGB: 1

databases:
  - name: cv-ledger-db
    plan: free
